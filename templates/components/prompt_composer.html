<!-- Flowbite Prompt Composer Component -->
<div class="rounded-xl border border-border bg-card p-5 sm:p-6 shadow-panel">
    <form method="POST" action="{% url 'research:workspace' %}" class="relative" id="promptForm">
        {% csrf_token %}
        <div class="flex items-center justify-between mb-2">
            <label for="promptInput" class="block text-xs font-semibold uppercase tracking-wider text-muted-foreground">Ask Copilot</label>
            <span class="hidden sm:inline-flex items-center gap-1.5 text-xs text-muted-foreground">
                <span>Press</span>
                <kbd class="px-1.5 py-0.5 text-[10px] font-semibold text-muted-foreground bg-muted border border-border rounded">Ctrl</kbd>
                <span>+</span>
                <kbd class="px-1.5 py-0.5 text-[10px] font-semibold text-muted-foreground bg-muted border border-border rounded">Enter</kbd>
                <span>to analyze</span>
            </span>
        </div>

        <div class="relative">
            <textarea name="prompt" id="promptInput" rows="3" class="block p-3.5 w-full text-sm text-foreground bg-background rounded-lg border border-input focus:ring-ring focus:border-ring placeholder-muted-foreground transition-colors"
                placeholder="Contoh: Bandingkan valuasi dan foreign flow BBCA dan BMRI dalam 30 hari terakhir..."></textarea>
        </div>
        
        <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-1.5 text-xs">
                <span class="text-muted-foreground text-[11px] mr-1 hidden sm:inline">Templates:</span>
                <button type="button" class="inline-flex items-center rounded-full border border-border bg-secondary px-3 py-1.5 text-xs font-medium text-secondary-foreground hover:bg-muted-dark hover:border-primary transition-colors" data-prompt="Analisis fundamental dan valuasi BBCA">BBCA Fundamental</button>
                <button type="button" class="inline-flex items-center rounded-full border border-border bg-secondary px-3 py-1.5 text-xs font-medium text-secondary-foreground hover:bg-muted-dark hover:border-primary transition-colors" data-prompt="Bandingkan performa BBCA dan BMRI 30 hari terakhir">BBCA vs BMRI</button>
                <button type="button" class="inline-flex items-center rounded-full border border-border bg-secondary px-3 py-1.5 text-xs font-medium text-secondary-foreground hover:bg-muted-dark hover:border-primary transition-colors" data-prompt="Cek tren foreign flow dan broker akumulasi TLKM">Foreign Flow TLKM</button>
                <button type="button" class="inline-flex items-center rounded-full border border-border bg-secondary px-3 py-1.5 text-xs font-medium text-secondary-foreground hover:bg-muted-dark hover:border-primary transition-colors" data-prompt="Screening saham perbankan IDX yang undervalued dengan dividend yield tinggi">Screen Perbankan Value</button>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <button type="submit" class="w-full sm:w-auto inline-flex items-center justify-center rounded-lg bg-primary px-6 py-2.5 text-sm font-semibold text-primary-foreground shadow-sm hover:bg-primary-dark disabled:opacity-50 disabled:cursor-not-allowed transition-all gap-2" id="analyzeBtn">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    <span>Analyze Request</span>
                </button>
            </div>
        </div>
    </form>

    <!-- Authentic Agent Processing Status -->
    <div id="loadingStepper" class="hidden mt-6 rounded-xl border border-primary/20 bg-primary/10 p-5">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div role="status">
                    <svg aria-hidden="true" class="w-5 h-5 text-muted animate-spin fill-primary" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
                        <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/>
                    </svg>
                    <span class="sr-only">Loading...</span>
                </div>
                <div>
                    <h3 class="text-sm font-semibold text-primary">Synthesizing IDX Market Intelligence</h3>
                    <p class="text-xs text-muted-foreground mt-0.5">Executing parallel queries to Sectors Financial API & grounding investment thesis...</p>
                </div>
            </div>
            <span class="text-xs text-muted-foreground font-mono" id="stepTimer">Elapsed: 0s</span>
        </div>
    </div>

    <!-- Inline Flowbite Guardrail / Out of Scope Alert -->
    <div id="guardAlert" class="hidden mt-5 p-4 mb-4 text-sm rounded-xl bg-warning/10 border border-warning/20" role="alert">
        <div class="flex items-start gap-3">
            <svg class="flex-shrink-0 inline w-5 h-5 mt-0.5 text-warning" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
            </svg>
            <div class="space-y-2 flex-1">
                <div class="font-semibold text-warning" id="guardTitle">Lingkup Riset Saham IDX</div>
                <p class="text-card-foreground text-xs leading-relaxed" id="guardMessage"></p>
                <div class="pt-2">
                    <span class="text-[11px] font-semibold uppercase tracking-wider text-muted-foreground block mb-1.5">Rekomendasi Pertanyaan:</span>
                    <div class="flex flex-wrap gap-1.5" id="guardSuggestions"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(() => {
    const textarea = document.getElementById('promptInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const form = document.getElementById('promptForm');
    const stepper = document.getElementById('loadingStepper');
    const stepTimer = document.getElementById('stepTimer');
    const guardAlert = document.getElementById('guardAlert');
    const guardMessage = document.getElementById('guardMessage');
    const guardSuggestions = document.getElementById('guardSuggestions');

    const bindChips = (container) => {
        container.querySelectorAll('[data-prompt]').forEach(btn => {
            btn.addEventListener('click', () => {
                textarea.value = btn.dataset.prompt;
                textarea.focus();
                guardAlert.classList.add('hidden');
            });
        });
    };

    bindChips(document);

    textarea.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            form.requestSubmit();
        }
    });

    textarea.addEventListener('input', () => {
        if (!guardAlert.classList.contains('hidden')) {
            guardAlert.classList.add('hidden');
        }
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const prompt = textarea.value.trim();

        if (prompt.length < 3) {
            guardAlert.classList.remove('hidden');
            guardMessage.textContent = 'Pertanyaan harus berisi minimal 3 karakter.';
            return;
        }

        guardAlert.classList.add('hidden');
        analyzeBtn.disabled = true;
        analyzeBtn.innerHTML = `
            <svg aria-hidden="true" class="w-4 h-4 text-muted animate-spin fill-white" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
                <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/>
            </svg>
            <span>Analyzing...</span>
        `;
        stepper.classList.remove('hidden');

        let seconds = 0;
        const timerInterval = setInterval(() => {
            seconds++;
            stepTimer.textContent = `Elapsed: ${seconds}s`;
        }, 1000);

        const formData = new FormData(form);

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                }
            });

            const data = await response.json();
            clearInterval(timerInterval);

            if (data.redirect) {
                window.location.href = data.redirect;
            } else if (data.is_out_of_scope || data.error) {
                stepper.classList.add('hidden');
                analyzeBtn.disabled = false;
                analyzeBtn.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    <span>Analyze Request</span>
                `;

                guardAlert.classList.remove('hidden');
                guardMessage.textContent = data.error || 'Pertanyaan tidak dapat diproses.';
                guardSuggestions.innerHTML = '';

                const suggestions = data.suggestions || [
                    'Analisis fundamental BBCA',
                    'Bandingkan BMRI dan BBRI 30 hari',
                    'Screening saham perbankan undervalue'
                ];

                suggestions.forEach(item => {
                    const chip = document.createElement('button');
                    chip.type = 'button';
                    chip.className = 'rounded-full border border-warning/20 bg-warning/10 px-2.5 py-1 text-xs text-warning hover:border-warning hover:text-warning-foreground transition-colors';
                    chip.dataset.prompt = item;
                    chip.textContent = item;
                    guardSuggestions.appendChild(chip);
                });
                bindChips(guardSuggestions);
            } else if (data.reportId) {
                window.location.href = `/report/${data.reportId}/`;
            }
        } catch (err) {
            clearInterval(timerInterval);
            stepper.classList.add('hidden');
            analyzeBtn.disabled = false;
            analyzeBtn.innerHTML = `
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                <span>Analyze Request</span>
            `;
            guardAlert.classList.remove('hidden');
            guardMessage.textContent = 'Terjadi kesalahan saat memproses permintaan. Silakan coba kembali.';
        }
    });
})();
</script>

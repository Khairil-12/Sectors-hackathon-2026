<div class="bg-surface-900 border border-gray-800 rounded-lg shadow-panel p-4">
    <form method="POST" action="{% url 'research:workspace' %}" class="relative" id="promptForm">
        {% csrf_token %}
        <textarea name="prompt" id="promptInput" rows="3" class="w-full rounded-lg border border-slate-700 bg-surface-950 px-4 py-3 text-white placeholder-slate-500 focus:border-brand-500 focus:outline-none transition-colors"
            placeholder="Contoh: Bandingkan BBCA dan BMRI untuk 30 hari terakhir..."></textarea>
        <div class="flex justify-between items-center mt-3">
            <div class="flex gap-2 text-xs">
                <button type="button" class="px-3 py-1 bg-surface-950 border border-gray-700 rounded-full hover:border-brand-500 text-gray-300" data-prompt="Analisis BBCA fundamentals">Analisis Saham</button>
                <button type="button" class="px-3 py-1 bg-surface-950 border border-gray-700 rounded-full hover:border-brand-500 text-gray-300" data-prompt="Cek Foreign Flow TLKM">Cek Foreign Flow</button>
            </div>
            <button type="submit" class="bg-brand-600 hover:bg-brand-500 text-white px-6 py-2 rounded-md font-medium transition-colors" id="analyzeBtn" disabled>
                Analyze
            </button>
        </div>
    </form>
</div>

<script>
(() => {
    const buttons = document.querySelectorAll('[data-prompt]');
    const textarea = document.getElementById('promptInput');
    const analyzeBtn = document.getElementById('analyzeBtn');

    buttons.forEach(btn => {
        btn.addEventListener('click', () => {
            textarea.value = btn.dataset.prompt;
            analyzeBtn.disabled = false;
        });
    });

    const form = document.getElementById('promptForm');
    const originalDisabled = analyzeBtn.disabled;
    textarea.addEventListener('input', () => {
        analyzeBtn.disabled = textarea.value.trim().length < 3;
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        analyzeBtn.disabled = true;
        analyzeBtn.textContent = "Sedang menganalisis...";

        const formData = new FormData(form);
        const prompt = formData.get('prompt').trim();

        if (prompt.length < 3) {
            alert('Pertanyaan terlalu pendek.');
            analyzeBtn.disabled = originalDisabled;
            analyzeBtn.textContent = 'Analyze';
            return;
        }

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': form.csrfToken || ''
                }
            });

            const data = await response.json();
            if (data.redirect) {
                window.location.href = data.redirect;
            } else if (data.error) {
                alert(data.error);
            } else {
                window.location.href = '/report/' + data.reportId;
            }
        } catch (err) {
            alert('Terjadi kesalahan. Silakan coba lagi.');
        } finally {
            analyzeBtn.disabled = originalDisabled;
            analyzeBtn.textContent = 'Analyze';
        }
    });
})();
</script>

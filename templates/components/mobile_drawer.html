<!-- Mobile Off-Canvas Drawer Navigation (Flowbite) -->
<div id="mobile-drawer" class="fixed top-0 left-0 z-40 h-screen p-5 overflow-y-auto transition-transform -translate-x-full bg-surface-900 w-72 border-r border-slate-800 lg:hidden flex flex-col justify-between" tabindex="-1" aria-labelledby="mobile-drawer-label">
    <div>
        <!-- Drawer Header -->
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-800">
            <a href="{% url 'research:workspace' %}" class="flex items-center gap-2 text-lg font-bold text-brand-400">
                <span class="h-2.5 w-2.5 rounded-full bg-brand-500"></span>
                <span id="mobile-drawer-label">IDX Copilot</span>
            </a>
            <button type="button" data-drawer-hide="mobile-drawer" aria-controls="mobile-drawer" class="text-slate-400 bg-transparent hover:bg-surface-800 hover:text-white rounded-lg text-sm w-8 h-8 inline-flex items-center justify-center transition-colors">
                <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
                </svg>
                <span class="sr-only">Close menu</span>
            </button>
        </div>

        <!-- Navigation Links -->
        <ul class="space-y-1.5 font-medium text-sm">
            <li>
                <a href="{% url 'research:workspace' %}" class="flex items-center gap-3 p-2.5 rounded-lg transition-colors {% if request.resolver_match.url_name == 'workspace' %}bg-brand-600 text-white shadow-sm{% else %}text-slate-300 hover:bg-surface-950 hover:text-white{% endif %}">
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span>New Analysis</span>
                </a>
            </li>
            <li>
                <a href="{% url 'research:dashboard' %}" class="flex items-center gap-3 p-2.5 rounded-lg transition-colors {% if request.resolver_match.url_name == 'dashboard' %}bg-brand-600 text-white shadow-sm{% else %}text-slate-300 hover:bg-surface-950 hover:text-white{% endif %}">
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                    </svg>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="{% url 'research:comparison' %}" class="flex items-center gap-3 p-2.5 rounded-lg transition-colors {% if request.resolver_match.url_name == 'comparison' %}bg-brand-600 text-white shadow-sm{% else %}text-slate-300 hover:bg-surface-950 hover:text-white{% endif %}">
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                    <span>Compare Stocks</span>
                </a>
            </li>
            <li>
                <a href="{% url 'research:screener' %}" class="flex items-center gap-3 p-2.5 rounded-lg transition-colors {% if request.resolver_match.url_name == 'screener' %}bg-brand-600 text-white shadow-sm{% else %}text-slate-300 hover:bg-surface-950 hover:text-white{% endif %}">
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                    </svg>
                    <span>Screener</span>
                </a>
            </li>
            <li>
                <a href="{% url 'research:watchlist' %}" class="flex items-center justify-between p-2.5 rounded-lg transition-colors {% if request.resolver_match.url_name == 'watchlist' %}bg-brand-600 text-white shadow-sm{% else %}text-slate-300 hover:bg-surface-950 hover:text-white{% endif %}">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-slate-400 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path>
                        </svg>
                        <span>Watchlist</span>
                    </div>
                </a>
            </li>
            <li>
                <a href="{% url 'research:saved_reports' %}" class="flex items-center gap-3 p-2.5 rounded-lg transition-colors {% if request.resolver_match.url_name == 'saved_reports' %}bg-brand-600 text-white shadow-sm{% else %}text-slate-300 hover:bg-surface-950 hover:text-white{% endif %}">
                    <svg class="w-5 h-5 text-slate-400 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <span>Saved Reports</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Drawer Footer -->
    <div class="pt-4 mt-6 border-t border-slate-800 text-xs text-slate-500">
        <p class="text-[11px]">IDX Equity Intelligence Platform</p>
    </div>
</div>

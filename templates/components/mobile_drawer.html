<!-- Mobile Off-Canvas Drawer Navigation -->
<div id="mobile-drawer" class="fixed top-0 left-0 z-40 h-screen p-5 overflow-y-auto transition-transform -translate-x-full bg-sidebar w-72 border-r border-sidebar-border lg:hidden" tabindex="-1" aria-labelledby="mobile-drawer-label">
    <!-- Drawer Header -->
    <div class="flex items-center justify-between pb-4 mb-4 border-b border-sidebar-border">
        <a href="{% url 'research:workspace' %}" class="flex items-center gap-2 text-lg font-semibold text-sidebar-foreground">
            <span class="h-2.5 w-2.5 rounded-full bg-sidebar-ring"></span>
            <span id="mobile-drawer-label">IDX Copilot</span>
        </a>
        <button type="button" data-drawer-hide="mobile-drawer" aria-controls="mobile-drawer" class="text-sidebar-foreground bg-transparent hover:bg-sidebar-accent hover:text-sidebar-accent-foreground rounded-lg text-sm w-8 h-8 inline-flex items-center justify-center transition-colors">
            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
            </svg>
            <span class="sr-only">Close menu</span>
        </button>
    </div>

    <!-- Navigation Links -->
    <ul class="space-y-1.5 font-medium text-sm">
            <li>
                <a href="{% url 'research:workspace' %}" class="flex items-center gap-3 p-2.5 rounded-lg transition-colors {% if request.resolver_match.url_name == 'workspace' %}bg-sidebar-primary text-sidebar-primary-foreground font-medium{% else %}text-sidebar-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    <span>New Analysis</span>
                </a>
            </li>
            <li>
                <a href="{% url 'research:dashboard' %}" class="flex items-center gap-3 p-2.5 rounded-lg transition-colors {% if request.resolver_match.url_name == 'dashboard' %}bg-sidebar-primary text-sidebar-primary-foreground font-medium{% else %}text-sidebar-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                    </svg>
                    <span>Market</span>

            </li>
            <li>
                <a href="{% url 'research:comparison' %}" class="flex items-center gap-3 p-2.5 rounded-lg transition-colors {% if request.resolver_match.url_name == 'comparison' %}bg-sidebar-primary text-sidebar-primary-foreground font-medium{% else %}text-sidebar-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    </svg>
                    <span>Compare Stocks</span>
                </a>
            </li>
            <li>
                <a href="{% url 'research:screener' %}" class="flex items-center gap-3 p-2.5 rounded-lg transition-colors {% if request.resolver_match.url_name == 'screener' %}bg-sidebar-primary text-sidebar-primary-foreground font-medium{% else %}text-sidebar-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground{% endif %}">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

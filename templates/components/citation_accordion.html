<!-- Flowbite Citation Accordion Item -->
<details class="group rounded-xl border border-slate-800 bg-surface-950 p-4 transition-colors open:border-brand-800/80 open:bg-surface-900">
  <summary class="flex cursor-pointer items-center justify-between font-mono text-xs font-semibold text-brand-400">
    <div class="flex items-center gap-2">
      <span class="h-2 w-2 rounded-full bg-brand-500"></span>
      <span>{{ source }}</span>
    </div>
    <span class="text-slate-400 transition group-open:rotate-180">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
      </svg>
    </span>
  </summary>
  <div class="mt-3 pt-3 border-t border-slate-800 text-xs text-slate-300 leading-relaxed font-sans">
    {{ details }}
  </div>
</details>

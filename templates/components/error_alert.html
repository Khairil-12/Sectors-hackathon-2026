<!-- Flowbite Dismissible Error Alert -->
<div id="error-alert" class="flex items-start p-4 mb-4 text-sm rounded-xl bg-red-950/30 border border-red-900/60 text-red-300" role="alert">
  <svg class="flex-shrink-0 inline w-5 h-5 mr-3 text-red-400 mt-0.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
    <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"/>
  </svg>
  <div class="flex-1">
    <span class="font-semibold text-red-400 block mb-0.5">Error Encountered</span>
    <div class="text-xs text-slate-300 leading-relaxed">{{ error }}</div>
  </div>
  <button type="button" class="ml-auto -mx-1.5 -my-1.5 bg-transparent text-red-400 rounded-lg p-1.5 inline-flex items-center justify-center h-8 w-8 hover:bg-red-900/40 hover:text-white" onclick="document.getElementById('error-alert')?.remove()">
    <span class="sr-only">Close</span>
    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
      <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/>
    </svg>
  </button>
</div>

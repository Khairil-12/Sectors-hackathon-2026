<!-- Flowbite Empty State Card -->
<div class="rounded-xl border border-dashed border-slate-800 bg-surface-900/40 p-8 sm:p-12 text-center">
  <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-surface-800 text-slate-400">
    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
    </svg>
  </div>
  <h3 class="mt-3 text-sm font-semibold text-slate-200">No data found</h3>
  <p class="mt-1 text-xs text-slate-500 max-w-sm mx-auto">{{ message|default:"No records or data points are available for this section." }}</p>
  {% if cta_url and cta_label %}
    <div class="mt-4">
      <a href="{{ cta_url }}" class="inline-flex items-center rounded-lg bg-brand-600 px-4 py-2 text-xs font-semibold text-white hover:bg-brand-500 transition-colors">
        {{ cta_label }}
      </a>
    </div>
  {% endif %}
</div>

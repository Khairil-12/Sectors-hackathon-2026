<!-- Flowbite Metric Card -->
<div class="rounded-xl border border-slate-800 bg-surface-900 p-5 shadow-panel hover:border-slate-700 transition-all">
  <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">{{ label }}</div>
  <div class="mt-2 text-2xl font-bold text-white tracking-tight">{{ value }}</div>
  {% if change %}
    <div class="mt-2 text-xs font-medium {% if change_type == 'positive' %}text-emerald-400{% elif change_type == 'negative' %}text-red-400{% else %}text-slate-400{% endif %}">
      {{ change }}
    </div>
  {% endif %}
</div>

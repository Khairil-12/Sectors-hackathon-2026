<div class="rounded-xl border border-brand-800/80 bg-surface-950 p-5 space-y-3 animate-fade-in shadow-panel">
    <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
        <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-md bg-brand-950 border border-brand-800 flex items-center justify-center text-brand-400">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
                </svg>
            </div>
            <span class="text-xs font-semibold text-slate-300 font-mono">Q: {{ question }}</span>
        </div>
        <span class="text-[11px] text-emerald-400 font-medium">Grounded in Report Data</span>
    </div>

    {% if error %}
        <p class="text-xs text-red-400">{{ error }}</p>
    {% else %}
        <div class="text-sm text-slate-200 leading-relaxed whitespace-pre-line">
            {{ answer }}
        </div>
    {% endif %}
</div>

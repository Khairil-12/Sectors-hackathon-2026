{% extends "base.html" %}
{% block title %}Screener - IDX Copilot{% endblock %}
{% block content %}
<section class="mx-auto max-w-6xl space-y-8">
    <div><p class="text-sm text-brand-500">Discovery</p><h1 class="mt-2 text-3xl font-bold">Company screener</h1><p class="mt-2 text-slate-400">Find IDX companies using natural language or structured financial filters.</p></div>
    <div class="rounded-lg border border-slate-800 bg-surface-900 p-6"><label class="text-sm font-medium text-slate-300">Describe your screen</label><div class="mt-3 flex flex-col gap-3 sm:flex-row"><input class="min-w-0 flex-1 rounded-md border border-slate-700 bg-surface-950 px-4 py-3 text-white placeholder-slate-500 focus:border-brand-500 focus:outline-none" placeholder="Example: profitable banking companies with growing revenue"><button class="rounded-md bg-brand-600 px-5 py-3 font-medium hover:bg-brand-500">Search</button></div></div>
    <div class="rounded-lg border border-dashed border-slate-800 bg-surface-900/50 p-12 text-center"><h2 class="font-semibold">No screening results</h2><p class="mt-2 text-sm text-slate-400">Submit a screening query to see matching companies.</p></div>
</section>
{% endblock %}
